# The site, built and served: skiff's page written with skiff (site/), a
# program of skiff-framework's skiff.app.
#
# Twice from one source: natively, the program that writes the page out --
# static.html, with no script, and the markup put into the page Emscripten
# made, which a browser shows before the WebAssembly has loaded; and under
# Emscripten, the page itself. Then GitHub Pages serves the files.
name: pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Clang 23 and the distribution's libstdc++, for the native program.
      - name: clang 23
        run: |
          sudo apt-get update || true
          sudo apt-get install -y ninja-build python3 pkg-config \
            lsb-release software-properties-common gnupg curl
          curl -fsSL https://apt.llvm.org/llvm.sh -o /tmp/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh 23 all
          echo /usr/lib/llvm-23/bin >> "$GITHUB_PATH"

      - name: cmake
        run: |
          version=4.3.4
          curl -sSL -o cmake.tar.gz \
            "https://github.com/Kitware/CMake/releases/download/v${version}/cmake-${version}-linux-x86_64.tar.gz"
          sudo tar xzf cmake.tar.gz -C /opt
          echo "/opt/cmake-${version}-linux-x86_64/bin" >> "$GITHUB_PATH"

      - name: what import std reads from libstdc++
        run: |
          std=$(ls /usr/include/c++/*/bits/std.cc | sort -V | tail -1)
          cat > /tmp/libstdc++.modules.json <<EOF
          {
            "version": 1,
            "revision": 1,
            "modules": [
              { "logical-name": "std", "source-path": "$std",
                "is-std-library": true },
              { "logical-name": "std.compat",
                "source-path": "${std%std.cc}std.compat.cc",
                "is-std-library": true }
            ]
          }
          EOF

      # Emscripten, as the last run left it (its sysroot's libraries built
      # once): installed only where it is not.
      - uses: actions/cache@v4
        with:
          path: /tmp/emsdk
          key: emsdk-6.0.13-${{ runner.os }}
      - name: Emscripten
        run: |
          if [ ! -x /tmp/emsdk/emsdk ]; then
            git clone --depth 1 https://github.com/emscripten-core/emsdk.git /tmp/emsdk
            /tmp/emsdk/emsdk install 6.0.13
          fi
          /tmp/emsdk/emsdk activate 6.0.13

      - name: the DOM bridge through EM_JS
        run: |
          source /tmp/emsdk/emsdk_env.sh
          python3 test/browser_bridge.py

      # Which build of the compiler this is: apt.llvm.org's clang 23 is a
      # nightly, and a module file is read only by the build that made it.
      - name: the compiler's build
        run: echo "COMPILER_BUILD=$( (clang++-23 --version; /tmp/emsdk/upstream/bin/clang++ --version) | sha256sum | cut -c1-12)" >> "$GITHUB_ENV"
      # The builds and the fetched sources the last run kept: as mux keeps
      # them, in one job here -- the build is short.
      - uses: actions/cache/restore@v4
        with:
          path: |
            build
            ~/.cache/cmake-everywhere
          key: build-${{ runner.os }}-${{ env.COMPILER_BUILD }}-${{ github.sha }}
          restore-keys: build-${{ runner.os }}-${{ env.COMPILER_BUILD }}-
      # ninja goes by file times: a source changed since the build restored
      # was made -- its hash other than the list the build keeps -- gets the
      # time this run began; the rest, an old one.
      - name: file times against the build restored
        run: |
          mkdir -p build
          began=$(date +%s)
          git ls-files -z | xargs -0 touch -d "@1000000000"
          if [ -f build/sources.sha1 ]; then
            git ls-files -z | xargs -0 sha1sum | sort > /tmp/sources-now.sha1
            sort build/sources.sha1 | comm -13 - /tmp/sources-now.sha1 | cut -c43- > build/changed-sources
          else
            git ls-files > build/changed-sources
          fi
          tr '\n' '\0' < build/changed-sources | xargs -0 -r touch -d "@$began"

      # views::enumerate is libc++ 23's, and Emscripten's libc++ is 22: the
      # view, from the libc++ 23 that came with clang 23, put into
      # Emscripten's -- its header, <ranges> including it, the std module
      # exporting it. Until an emsdk comes with libc++ 23.
      - name: views::enumerate in Emscripten's libc++
        run: |
          python3 - <<'EOF'
          import pathlib, shutil
          e = pathlib.Path('/tmp/emsdk/upstream/emscripten')
          view = pathlib.Path('/usr/lib/llvm-23/include/c++/v1/__ranges/enumerate_view.h')
          places = [(e / 'system/lib/libcxx/include', e / 'system/lib/libcxx/modules/std/ranges.inc'),
                    (e / 'cache/sysroot/include/c++/v1', e / 'cache/sysroot/share/libc++/v1/std/ranges.inc')]
          export = ('\n    // [range.enumerate]\n    using std::ranges::enumerate_view;\n\n'
                    '    namespace views {\n      using std::ranges::views::enumerate;\n    }\n')
          for include, module in places:
              if not (include / 'ranges').exists():
                  continue
              shutil.copy(view, include / '__ranges/enumerate_view.h')
              ranges = (include / 'ranges').read_text()
              if 'enumerate_view.h' not in ranges:
                  at = '#    include <__ranges/elements_view.h>\n'
                  assert at in ranges
                  ranges = ranges.replace(at, at + '#    include <__ranges/enumerate_view.h>\n', 1)
                  (include / 'ranges').write_text(ranges)
              text = module.read_text()
              if 'views::enumerate' not in text:
                  at = '      using std::ranges::views::chunk_by;\n    }\n'
                  assert at in text
                  text = text.replace(at, at + export, 1)
                  module.write_text(text)
              print('enumerate put into', include)
          EOF

      - name: the page, under Emscripten
        run: |
          source /tmp/emsdk/emsdk_env.sh
          emcmake cmake -S . -B build/wasm -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_FLAGS="-fexceptions -mmutable-globals" \
            -DCME_STORE_ENABLED=ON -DCME_SOURCES_ENABLED=ON
          cmake --build build/wasm --target site site_client -- -k 0
          # One std module: every unit compiled with the same flags. Two, and
          # a unit importing modules made over both is one clang crashes on.
          std=$(grep -oE 'cmake_cxx_std[^/ ]*\.dir' build/wasm/build.ninja | sort -u)
          echo "$std"
          test "$(echo "$std" | wc -l)" = 1

      # A frontend's build: the framework without its canvas, so without
      # skiff's scene -- the page alone, with a canvas of its own in it
      # (test/page.cc), written out and read. Checked, not served.
      - name: a page alone, without the canvas, natively
        run: |
          cmake -S . -B build/page -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang-23 \
            -DCMAKE_CXX_COMPILER=clang++-23 \
            -DCMAKE_CXX_FLAGS="-stdlib=libstdc++" \
            -DCMAKE_CXX_STDLIB_MODULES_JSON=/tmp/libstdc++.modules.json \
            -DSKIFF_FRAMEWORK_CANVAS=OFF -DSKIFF_FRAMEWORK_SSR=OFF -DSKIFF_FRAMEWORK_LIVE=OFF \
            -DCME_STORE_ENABLED=ON -DCME_SOURCES_ENABLED=ON
          grep -q "^SKIFF_UI:BOOL=OFF" build/page/CMakeCache.txt
          cmake --build build/page --target skiff_framework_page_test -- -k 0
          (cd build/page && ctest -R page --output-on-failure)

      - name: the program that writes it out, natively
        run: |
          cmake -S . -B build/native -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang-23 \
            -DCMAKE_CXX_COMPILER=clang++-23 \
            -DCMAKE_CXX_FLAGS="-stdlib=libstdc++" \
            -DCMAKE_CXX_STDLIB_MODULES_JSON=/tmp/libstdc++.modules.json \
            -DCME_STORE_ENABLED=ON -DCME_SOURCES_ENABLED=ON
          cmake --build build/native --target site -- -k 0
          cmake --build build/native --target skiff_framework_state_test -- -k 0
          build/native/skiff_framework_state_test
          cmake --build build/native --target skiff_framework_page_test -- -k 0
          cmake --build build/native --target skiff_framework_net_test skiff_framework_net_native_test skiff_framework_route_test skiff_framework_timer_test skiff_framework_todo_live_test skiff_framework_switch_test -- -k 0
          (cd build/native && ctest -R "net|route|timer|todo|switch" --output-on-failure)
          (cd build/native && ctest -R page --output-on-failure)
          # Served live: the page streamed, a generation of it in the first piece.
          build/native/skiff_framework_page_test serve 8099 &
          server=$!
          sleep 2
          curl -sN --max-time 3 http://127.0.0.1:8099/ > /tmp/live.html || true
          kill $server
          head -c 2000 /tmp/live.html
          grep -q '<skiff-live id="skiff-g1"><template shadowrootmode="open">' /tmp/live.html
          grep -q 'A page, and a canvas in it' /tmp/live.html
          grep -q '<skiff-client data-skiff-client="0"' /tmp/live.html
          std=$(grep -oE 'cmake_cxx_std[^/ ]*\.dir' build/native/build.ninja | sort -u)
          echo "$std"
          test "$(echo "$std" | wc -l)" = 1

      - name: the site, put together
        run: |
          mkdir -p public
          cp build/wasm/site/index.html build/wasm/site/index.js build/wasm/site/index.wasm public/
          cp build/wasm/site/client.js build/wasm/site/client.wasm public/
          ls -la build/wasm/site/index.wasm build/wasm/site/client.wasm
          # The page as its own server: its service worker and the page's side.
          cp web/skiff-sw.js web/skiff-served.js public/
          # And what the network answers under served/ where the worker
          # does not: back to the page, and the keep-alive -- not a 404.
          cp -r web/served public/
          build/native/site/site public/static.html public/index.html
          # The script and the WebAssembly named by this revision: a browser
          # that kept the last index.js would load it with the new index.wasm,
          # and their imports would not match.
          V=${GITHUB_SHA::12}
          # However Emscripten's minifier wrote the tag (async or not, quoted
          # or not, its attributes in any order): its src named by revision.
          grep -o '<script[^>]*index\.js[^>]*>' public/index.html || true
          python3 - "$V" <<'PY'
          import re, sys, pathlib
          page = pathlib.Path('public/index.html')
          text = page.read_text()
          made, count = re.subn(r'(<script[^>]*?\bsrc=)(["\']?)(index|skiff-served)\.js\2', lambda m: m.group(1) + '"' + m.group(3) + '.js?v=' + sys.argv[1] + '"', text)
          print('index.js named by revision in', count, 'tag(s)')
          page.write_text(made)
          PY
          sed -i "s#locateFile(\"index.wasm\")#locateFile(\"index.wasm?v=$V\")#" public/index.js
          sed -i "s#locateFile(\"client.wasm\")#locateFile(\"client.wasm?v=$V\")#" public/client.js
          grep -q "index.js?v=$V" public/index.html || { echo "site: index.html does not name index.js by revision"; exit 1; }
          grep -q "index.wasm?v=$V" public/index.js || { echo "site: index.js does not name index.wasm by revision"; exit 1; }
          ls -la public

      # The site in real browsers, as it is published: the page, and served
      # both ways by the program in the service worker (test/browser).
      - name: in real browsers
        run: |
          mkdir -p /tmp/site
          cp -r public /tmp/site/skiff-framework
          (cd /tmp/site && python3 -m http.server 8000 > /tmp/http.log 2>&1 &)
          cd test/browser
          npm init -y > /dev/null
          npm install --no-audit --no-fund playwright@1 > /dev/null
          npx playwright install --with-deps chromium firefox > /dev/null
          node browser.mjs http://127.0.0.1:8000/skiff-framework/

      # Kept for the next run, however this one went: what changed, built.
      - name: what the build was made from
        if: always()
        run: git ls-files -z | xargs -0 sha1sum | sort > build/sources.sha1
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            build
            ~/.cache/cmake-everywhere
          key: build-${{ runner.os }}-${{ env.COMPILER_BUILD }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
