<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>skiff -- a C++ UI library</title>
<meta name="description" content="skiff: a C++ UI library -- a typed tree, a model it is bound to, and two backends: a scene drawn by Skia, and the page.">
<script>
// The page served, where that was the choice (skiff-served.js): gone there
// before anything of the program loads. ?mode= says a new choice -- what the
// served pages' links ask with.
(() => {
  try {
    const asked = new URLSearchParams(location.search).get("mode");
    if (asked) {
      if (asked === "page") localStorage.removeItem("skiff:served"); else localStorage.setItem("skiff:served", asked);
      history.replaceState(null, "", location.pathname);
    }
    const mode = localStorage.getItem("skiff:served");
    if (mode && navigator.serviceWorker && navigator.serviceWorker.controller)
      location.replace("served/?script=" + (mode === "js" ? "1" : "0"));
  } catch (failed) {}
})();
</script>
</head>
<body>
<div id="skiff">@@SKIFF-PRERENDER@@</div>
@@SKIFF-STATE@@
<!-- The page served, by the program in a service worker standing in for a
     server (skiff-served.js, skiff-sw.js): without script, or with it. -->
<form id="skiff-served-switch" style="position:fixed;right:12px;bottom:12px;z-index:10;display:flex;gap:10px;padding:8px 12px;border-radius:10px;background:rgba(20,30,40,.88);color:#fff;font:13px system-ui,sans-serif" onchange="skiff.served.show(this.mode.value)">
<label><input type="radio" name="mode" value="page" checked> page</label>
<label><input type="radio" name="mode" value="nojs"> served, no JS</label>
<label><input type="radio" name="mode" value="js"> served, JS</label>
</form>
<script>var Module={print:function(o){console.log(o)},printErr:function(o){console.warn(o)}}</script>
{{{ SCRIPT }}}
<script src="skiff-served.js"></script>
</body>
</html>
